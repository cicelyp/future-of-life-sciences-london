<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none" stroke="#C4A97D" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Eiffel Tower illustration">
  <g opacity="0.82">

  <!-- ── SPIRE ──────────────────────────────────── -->
  <!-- Jewel / finial -->
  <polygon points="200,6 196,18 204,18" fill="#C4A97D" stroke="none"/>
  <!-- Spire shaft -->
  <line x1="200" y1="18" x2="200" y2="52" stroke-width="2"/>
  <!-- Antenna platform ring -->
  <rect x="194" y="52" width="12" height="5" rx="2" fill="#C4A97D" stroke="none"/>

  <!-- ── UPPER SPIRE TAPER ───────────────────────── -->
  <line x1="194" y1="57" x2="186" y2="82" stroke-width="1.5"/>
  <line x1="206" y1="57" x2="214" y2="82" stroke-width="1.5"/>
  <!-- horizontal braces on upper taper -->
  <line x1="190" y1="66" x2="210" y2="66" stroke-width="1"/>
  <line x1="188" y1="74" x2="212" y2="74" stroke-width="1"/>

  <!-- ── FIRST OBSERVATION PLATFORM ─────────────── -->
  <rect x="182" y="82" width="36" height="8" rx="1" fill="#C4A97D" stroke="none"/>
  <!-- railing suggestion -->
  <line x1="183" y1="82" x2="217" y2="82" stroke-width="0.75" stroke="#C4A97D"/>
  <line x1="183" y1="88" x2="217" y2="88" stroke-width="0.75" stroke="#C4A97D"/>
  <line x1="189" y1="82" x2="189" y2="90" stroke-width="0.75"/>
  <line x1="196" y1="82" x2="196" y2="90" stroke-width="0.75"/>
  <line x1="204" y1="82" x2="204" y2="90" stroke-width="0.75"/>
  <line x1="211" y1="82" x2="211" y2="90" stroke-width="0.75"/>

  <!-- ── BODY SECTION 1 (between platforms 1→2) ─── -->
  <!-- outline legs -->
  <line x1="182" y1="90" x2="168" y2="140" stroke-width="2"/>
  <line x1="218" y1="90" x2="232" y2="140" stroke-width="2"/>
  <!-- internal lattice -->
  <line x1="183" y1="94" x2="215" y2="94"  stroke-width="0.75"/>
  <line x1="181" y1="103" x2="219" y2="103" stroke-width="0.75"/>
  <line x1="179" y1="114" x2="221" y2="114" stroke-width="0.75"/>
  <line x1="177" y1="125" x2="223" y2="125" stroke-width="0.75"/>
  <!-- diagonal cross members -->
  <line x1="183" y1="90" x2="219" y2="114" stroke-width="0.75"/>
  <line x1="219" y1="90" x2="183" y2="114" stroke-width="0.75"/>
  <line x1="180" y1="114" x2="222" y2="140" stroke-width="0.75"/>
  <line x1="222" y1="114" x2="180" y2="140" stroke-width="0.75"/>

  <!-- ── SECOND OBSERVATION PLATFORM ───────────── -->
  <rect x="164" y="140" width="72" height="10" rx="1" fill="#C4A97D" stroke="none"/>
  <line x1="165" y1="140" x2="235" y2="140" stroke-width="0.75" stroke="#C4A97D"/>
  <line x1="165" y1="149" x2="235" y2="149" stroke-width="0.75" stroke="#C4A97D"/>
  <line x1="172" y1="140" x2="172" y2="150" stroke-width="0.75"/>
  <line x1="182" y1="140" x2="182" y2="150" stroke-width="0.75"/>
  <line x1="192" y1="140" x2="192" y2="150" stroke-width="0.75"/>
  <line x1="200" y1="140" x2="200" y2="150" stroke-width="0.75"/>
  <line x1="208" y1="140" x2="208" y2="150" stroke-width="0.75"/>
  <line x1="218" y1="140" x2="218" y2="150" stroke-width="0.75"/>
  <line x1="228" y1="140" x2="228" y2="150" stroke-width="0.75"/>

  <!-- ── BODY SECTION 2 (between platforms 2→3) ─── -->
  <line x1="166" y1="150" x2="142" y2="212" stroke-width="2"/>
  <line x1="234" y1="150" x2="258" y2="212" stroke-width="2"/>
  <!-- horizontal braces -->
  <line x1="163" y1="163" x2="237" y2="163" stroke-width="0.75"/>
  <line x1="159" y1="178" x2="241" y2="178" stroke-width="0.75"/>
  <line x1="155" y1="194" x2="245" y2="194" stroke-width="0.75"/>
  <!-- diagonal cross members -->
  <line x1="166" y1="150" x2="238" y2="178" stroke-width="0.75"/>
  <line x1="238" y1="150" x2="166" y2="178" stroke-width="0.75"/>
  <line x1="160" y1="178" x2="250" y2="212" stroke-width="0.75"/>
  <line x1="250" y1="178" x2="160" y2="212" stroke-width="0.75"/>

  <!-- ── THIRD PLATFORM (main observation deck) ──── -->
  <rect x="136" y="212" width="128" height="12" rx="1" fill="#C4A97D" stroke="none"/>
  <line x1="137" y1="212" x2="263" y2="212" stroke-width="0.75" stroke="#C4A97D"/>
  <line x1="137" y1="223" x2="263" y2="223" stroke-width="0.75" stroke="#C4A97D"/>
  <!-- railing posts -->
  <line x1="146" y1="212" x2="146" y2="224" stroke-width="0.75"/>
  <line x1="160" y1="212" x2="160" y2="224" stroke-width="0.75"/>
  <line x1="174" y1="212" x2="174" y2="224" stroke-width="0.75"/>
  <line x1="188" y1="212" x2="188" y2="224" stroke-width="0.75"/>
  <line x1="200" y1="212" x2="200" y2="224" stroke-width="0.75"/>
  <line x1="212" y1="212" x2="212" y2="224" stroke-width="0.75"/>
  <line x1="226" y1="212" x2="226" y2="224" stroke-width="0.75"/>
  <line x1="240" y1="212" x2="240" y2="224" stroke-width="0.75"/>
  <line x1="254" y1="212" x2="254" y2="224" stroke-width="0.75"/>

  <!-- ── UPPER LEG SECTION (below 3rd platform) ─── -->
  <!-- left leg -->
  <line x1="140" y1="224" x2="108" y2="300" stroke-width="2.5"/>
  <!-- right leg -->
  <line x1="260" y1="224" x2="292" y2="300" stroke-width="2.5"/>
  <!-- inner legs converge to arch supports -->
  <line x1="162" y1="224" x2="148" y2="300" stroke-width="1.5"/>
  <line x1="238" y1="224" x2="252" y2="300" stroke-width="1.5"/>
  <!-- horizontal bracings -->
  <line x1="134" y1="244" x2="266" y2="244" stroke-width="0.75"/>
  <line x1="128" y1="264" x2="272" y2="264" stroke-width="0.75"/>
  <line x1="122" y1="284" x2="278" y2="284" stroke-width="0.75"/>
  <!-- diagonals -->
  <line x1="140" y1="224" x2="165" y2="264" stroke-width="0.75"/>
  <line x1="165" y1="224" x2="140" y2="264" stroke-width="0.75"/>
  <line x1="235" y1="224" x2="260" y2="264" stroke-width="0.75"/>
  <line x1="260" y1="224" x2="235" y2="264" stroke-width="0.75"/>
  <line x1="125" y1="264" x2="150" y2="300" stroke-width="0.75"/>
  <line x1="150" y1="264" x2="125" y2="300" stroke-width="0.75"/>
  <line x1="250" y1="264" x2="275" y2="300" stroke-width="0.75"/>
  <line x1="275" y1="264" x2="250" y2="300" stroke-width="0.75"/>

  <!-- ── ARCH BASE PLATFORM ─────────────────────── -->
  <rect x="96" y="300" width="208" height="14" rx="1" fill="#C4A97D" stroke="none"/>
  <line x1="97" y1="300" x2="303" y2="300" stroke-width="0.75" stroke="#C4A97D"/>
  <line x1="97" y1="313" x2="303" y2="313" stroke-width="0.75" stroke="#C4A97D"/>

  <!-- ── ARCHED BASE / LEGS ─────────────────────── -->
  <!-- outer left leg -->
  <line x1="100" y1="314" x2="92" y2="420" stroke-width="3"/>
  <!-- outer right leg -->
  <line x1="300" y1="314" x2="308" y2="420" stroke-width="3"/>
  <!-- inner left leg -->
  <line x1="140" y1="314" x2="152" y2="420" stroke-width="3"/>
  <!-- inner right leg -->
  <line x1="260" y1="314" x2="248" y2="420" stroke-width="3"/>

  <!-- Grand arch between inner legs -->
  <path d="M152,420 Q152,330 200,318 Q248,330 248,420" stroke-width="2" fill="none"/>

  <!-- secondary arches (decorative filigree inside base) -->
  <path d="M100,420 Q100,360 122,340 Q144,326 152,314" stroke-width="1" fill="none"/>
  <path d="M300,420 Q300,360 278,340 Q256,326 248,314" stroke-width="1" fill="none"/>

  <!-- horizontal braces in leg section -->
  <line x1="92" y1="345" x2="310" y2="345" stroke-width="0.75"/>
  <line x1="90" y1="375" x2="310" y2="375" stroke-width="0.75"/>
  <line x1="88" y1="400" x2="312" y2="400" stroke-width="0.75"/>
  <!-- diagonals in outer legs -->
  <line x1="100" y1="314" x2="95" y2="345" stroke-width="0.75"/>
  <line x1="92" y1="345" x2="100" y2="314" stroke-width="0.75"/>
  <line x1="140" y1="314" x2="155" y2="345" stroke-width="0.75"/>
  <line x1="155" y1="314" x2="140" y2="345" stroke-width="0.75"/>
  <!-- cross members in legs -->
  <line x1="94" y1="345" x2="152" y2="380" stroke-width="0.75"/>
  <line x1="152" y1="345" x2="94" y2="380" stroke-width="0.75"/>
  <line x1="248" y1="345" x2="306" y2="380" stroke-width="0.75"/>
  <line x1="306" y1="345" x2="248" y2="380" stroke-width="0.75"/>

  <!-- ── GROUND LINE ─────────────────────────────── -->
  <line x1="50" y1="422" x2="350" y2="422" stroke-width="1.5"/>
  <!-- ground shadow suggestion -->
  <line x1="70" y1="426" x2="330" y2="426" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- ── LEFT TREE ───────────────────────────────── -->
  <!-- trunk -->
  <line x1="66" y1="422" x2="66" y2="395" stroke-width="2"/>
  <!-- foliage — layered ellipses suggest hand-drawn canopy -->
  <ellipse cx="66" cy="378" rx="18" ry="20" stroke-width="1.5" fill="none"/>
  <ellipse cx="58" cy="390" rx="10" ry="12" stroke-width="1" fill="none"/>
  <ellipse cx="74" cy="388" rx="11" ry="13" stroke-width="1" fill="none"/>
  <!-- branch lines -->
  <line x1="66" y1="400" x2="54" y2="390" stroke-width="1"/>
  <line x1="66" y1="400" x2="78" y2="392" stroke-width="1"/>

  <!-- ── RIGHT TREE ──────────────────────────────── -->
  <line x1="334" y1="422" x2="334" y2="395" stroke-width="2"/>
  <ellipse cx="334" cy="378" rx="18" ry="20" stroke-width="1.5" fill="none"/>
  <ellipse cx="326" cy="390" rx="10" ry="12" stroke-width="1" fill="none"/>
  <ellipse cx="342" cy="388" rx="11" ry="13" stroke-width="1" fill="none"/>
  <line x1="334" y1="400" x2="322" y2="390" stroke-width="1"/>
  <line x1="334" y1="400" x2="346" y2="392" stroke-width="1"/>

  <!-- ── SCATTER DOTS (editorial texture) ──────── -->
  <circle cx="76" cy="418" r="1.5" fill="#C4A97D"/>
  <circle cx="322" cy="416" r="1.5" fill="#C4A97D"/>
  <circle cx="84" cy="424" r="1" fill="#C4A97D"/>
  <circle cx="316" cy="424" r="1" fill="#C4A97D"/>

  </g>
</svg>
